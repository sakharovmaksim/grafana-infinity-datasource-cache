# Lint and tests on pull requests, master and tags. Images: master -> master, master-<sha>; tag vX.Y.Z -> X.Y.Z, X.Y, latest;
# pull requests and other branches build without pushing. A tag also publishes the chart (after its image) and a GitHub release.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: docker.io/sakharovmaksim/grafana-infinity-datasource-cache
  DOCKERHUB_USERNAME: sakharovmaksim
  CHART_DIR: charts/grafana-infinity-datasource-cache
  CHART_REGISTRY: oci://ghcr.io/sakharovmaksim/charts
  GOLANGCI_LINT_VERSION: v2.15.0
  HELM_VERSION: v4.3.2
  HELM_UNITTEST_VERSION: v1.1.0
  KUBECONFORM_VERSION: v0.8.0
  # Images are pushed only from master and release tags, as in the original pipeline.
  PUBLISH: ${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A prebuilt binary built with an older Go refuses modules that target a newer one.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - run: go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install tools
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "$HELM_UNITTEST_VERSION" --verify=false
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - run: helm lint --strict "$CHART_DIR" -f "$CHART_DIR/ci/default-values.yaml"
      - run: helm unittest "$CHART_DIR"
      - name: Validate manifests
        run: |
          helm template ci "$CHART_DIR" -f "$CHART_DIR/ci/default-values.yaml" \
            --set serviceMonitor.enabled=true --set networkPolicy.enabled=true \
            --set 'networkPolicy.from[0].podSelector.matchLabels.app=grafana' \
            | kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=master-,enable={{is_default_branch}}
            type=ref,event=pr
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  chart-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chart, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package "$CHART_DIR" --version "$version" --app-version "$version" --destination .dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push .dist/*.tgz "$CHART_REGISTRY"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [chart-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease
