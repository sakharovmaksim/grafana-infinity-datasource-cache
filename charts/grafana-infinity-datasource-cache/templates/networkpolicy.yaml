{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.from }}
{{- fail "networkPolicy.from: list the peers allowed to call the service (Grafana, the metrics scraper)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "gidc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gidc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gidc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.from | nindent 8 }}
{{- end }}
